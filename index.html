<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="漫读">
  <title>漫读</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 标签页：书架 -->
  <section id="library" class="tab">
    <header class="tab-header">
      <h1>书架</h1>
      <label id="import-btn" class="btn-primary" for="file-input">＋ 导入</label>
      <input id="file-input" class="visually-hidden" type="file" multiple>
    </header>

    <div id="empty" class="empty" hidden>
      <p class="empty-title">还没有漫画</p>
      <p>去「发现」页在线找漫画加入书架，或者点右上角「导入」，选择 <b>.cbz</b> / <b>.zip</b> 漫画文件、多张图片。</p>
      <p class="tip">在 iPhone 上：用 Safari 打开本页 → 点「分享」→「添加到主屏幕」，之后从桌面图标打开，就像一个 App。</p>
    </div>

    <ul id="grid" class="grid"></ul>
  </section>

  <!-- 标签页：发现 -->
  <section id="browse" class="tab" hidden>
    <header class="tab-header">
      <h1>发现</h1>
      <div class="header-controls">
        <select id="source-select" class="select" aria-label="漫画源"></select>
        <span id="source-settings" class="header-controls"></span>
      </div>
    </header>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="搜索漫画（中文名、英文名都行）" enterkeyhint="search" autocomplete="off">
    </form>
    <h3 id="browse-heading" class="section-title"></h3>
    <p id="browse-status" class="status"></p>
    <ul id="browse-grid" class="grid"></ul>
    <button id="load-more" class="btn-secondary load-more" hidden>加载更多</button>
    <p id="browse-credit" class="credit"></p>
  </section>

  <nav id="tabbar" class="tabbar">
    <button data-tab="library" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8-1 3.2 15.4-3.8 1z"/></svg>
      <span>书架</span>
    </button>
    <button data-tab="browse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
      <span>发现</span>
    </button>
  </nav>

  <!-- 浮层：漫画详情 -->
  <section id="detail" class="overlay" hidden>
    <div class="overlay-bar">
      <button id="detail-back" class="icon-btn" aria-label="返回">‹</button>
    </div>
    <div class="detail-head">
      <img id="detail-cover" class="detail-cover" alt="">
      <div class="detail-info">
        <h2 id="detail-title"></h2>
        <p id="detail-meta" class="muted"></p>
      </div>
    </div>
    <div class="detail-actions">
      <button id="detail-read" class="btn-primary">开始阅读</button>
      <button id="detail-library" class="btn-secondary">＋ 加入书架</button>
    </div>
    <p id="detail-desc" class="detail-desc"></p>
    <h3 id="chapter-count" class="section-title">章节</h3>
    <p id="detail-status" class="status"></p>
    <ul id="chapter-list" class="chapter-list"></ul>
    <p id="detail-credit" class="credit"></p>
  </section>

  <!-- 浮层：阅读器 -->
  <section id="reader" class="overlay" hidden>
    <div id="pager" class="pager">
      <img id="page-img" alt="">
      <div id="spinner" class="spinner" hidden></div>
    </div>
    <div id="scroller" class="scroller" hidden></div>

    <div class="bar top">
      <button id="back-btn" class="icon-btn" aria-label="返回">‹</button>
      <div id="reader-title" class="reader-title"></div>
      <select id="mode-select" class="select" aria-label="阅读模式">
        <option value="rtl">日漫（右→左）</option>
        <option value="ltr">左→右</option>
        <option value="vertical">条漫（竖向）</option>
      </select>
    </div>
    <div class="bar bottom">
      <span id="page-label" class="page-label">1 / 1</span>
      <input id="page-slider" type="range" min="1" max="1" value="1" aria-label="跳转页码">
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
